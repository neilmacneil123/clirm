[package]
name = "clirm"
version = "0.1.0"
edition = "2021"
description = "BCUninstaller-style CLI TUI for Windows"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
winreg = "0.55"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
is_elevated = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
chrono = "0.4"
roxmltree = "0.20"